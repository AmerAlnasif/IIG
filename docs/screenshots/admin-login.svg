<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="GBrain admin dashboard - Login page">
  <rect width="900" height="460" fill="#0a0a0f"/>
  <rect x="0" y="0" width="900" height="460" fill="#0a0a0f" rx="0"/><rect x="240.0" y="70.0" width="420" height="320" fill="#12121a" rx="16" stroke="#1e1e2e" stroke-width="1"/><text x="450.0" y="118.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#e0e0e0" text-anchor="middle">GBrain</text><rect x="264.0" y="142.0" width="372" height="128" fill="#88aaff14" rx="8" stroke="#88aaff33" stroke-width="1"/><text x="280.0" y="168.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="start">🔒  This is a protected dashboard</text><text x="280.0" y="190.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#888888" text-anchor="start">Ask your AI agent for the admin login link:</text><rect x="280.0" y="200.0" width="340" height="28" fill="#00000033" rx="6"/><text x="290.0" y="218.0" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#88aaff" text-anchor="start">"Give me the GBrain admin login link"</text><text x="280.0" y="248.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Each link is single-use. Your agent generates</text><text x="280.0" y="262.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#555555" text-anchor="start">a fresh one each time.</text><text x="264.0" y="302.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">▸ Or paste bootstrap token manually</text><rect x="264.0" y="318.0" width="372" height="34" fill="#0f0f1a" rx="8" stroke="#1e1e2e" stroke-width="1"/><text x="276.0" y="340.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">••••••••••••</text><rect x="264.0" y="362.0" width="372" height="34" fill="#3a3a5a" rx="8"/><text x="450.0" y="384.0" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#e0e0e0" text-anchor="middle">Submit</text><text x="450.0" y="436" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">HttpOnly session cookie only — the bootstrap token is never stored in browser JS</text>
</svg>
